format = 1
id = "server-filesystem"
kind = "server"
formal_targets = ["x86_64-unknown-linux-gnu"]
http_adapters = ["axum"]
web_profiles = ["web-embedded-native", "web-react-admin"]
required_capabilities = [
  "admin-static",
  "memory-sessions",
  "server-runtime",
  "server-health",
  "filesystem-root",
  "linux-openat2",
]
optional_capabilities = ["durable-operations"]

[policy]
revision = 1
session_idle_seconds = 1800
session_absolute_seconds = 43200
sessions_per_administrator = 32
sessions_global = 1024
login_window_seconds = 300
failures_per_source = 20
failures_per_account = 10
argon2_concurrency = 2
argon2_acquire_timeout_seconds = 2
session_last_seen_write_interval_seconds = 60
