[package]
name = "xcss-log"
description = "Portable structured event records, redaction, filtering and bounded sinks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
tracing = ["dep:tracing", "dep:tracing-subscriber"]

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
xcss-error = { path = "../xcss-error", version = "=1.0.0" }
thiserror.workspace = true
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
