name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  RUSTUP_TOOLCHAIN: 1.99.0

jobs:
  # Keep PR workflows and existing check names present; filter jobs, not triggers.
  scope:
    name: Change scope
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.changes.outputs.run_full }}
    steps:
      - name: Check out the comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select documentation or full validation
        id: changes
        shell: bash
        env:
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          run_full=true
          base=""
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" != tag ]]; then
            base="$PUSH_BASE"
          fi
          # Dispatches, release tags, new branches and unavailable history stay full.
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git diff --name-only --no-renames -z "$base" HEAD > "$RUNNER_TEMP/changed-paths"
            run_full=false
            while IFS= read -r -d '' path; do
              case "$path" in
                # Release/package inputs and safety audits retain full validation.
                docs/releases/* | docs/unsafe*.md | README.md | docs/operations.md) run_full=true; break ;;
                README.md | docs/*.md) ;;
                *) run_full=true; break ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
          echo "Full validation: $run_full"

  rust:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run_full != 'false' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Enforce workflow supply-chain policy
        run: |
          python3 scripts/check-workflow-supply-chain.py
          python3 scripts/check-xcss.py
          python3 scripts/xcss-conformance.py verify-xcss
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - name: Prove the server target gate rejects non-canonical targets
        run: |
          rustup target add aarch64-unknown-linux-gnu x86_64-unknown-linux-musl
          for target in aarch64-unknown-linux-gnu x86_64-unknown-linux-musl; do
            log="$RUNNER_TEMP/xcss-server-target-$target.log"
            if cargo check --locked -p xcss --target "$target" 2>"$log"; then
              echo "::error::xcss unexpectedly accepted $target"
              exit 1
            fi
            cat "$log"
            grep -F "xcss supports only x86_64-unknown-linux-gnu server builds" "$log"
          done
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify every Cargo package carries its audited license text
        run: python3 scripts/check-rust-package-licenses.py
      - name: Check all targets
        run: cargo check --locked --all-targets --all-features
      - name: Lint all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Verify server logging without the optional tracing adapter
        run: cargo clippy --locked --no-default-features -- -D warnings
      - name: Test the single server package
        run: cargo test --locked --all-targets --all-features
      - name: Reject Rust documentation warnings
        run: RUSTDOCFLAGS="-Dwarnings" cargo doc --locked --all-features --no-deps

  web:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run_full != 'false' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Enforce workflow supply-chain policy
        run: python3 scripts/check-workflow-supply-chain.py
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: false
      - name: Install pnpm
        run: npm install --global pnpm@10.34.6 --ignore-scripts
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the single Web package
        run: pnpm build
      - name: Typecheck Web modules
        run: pnpm typecheck:built
      - name: Test Web modules
        run: pnpm test:built
      - name: Install browser test engines
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Verify keyboard, authentication, workspace and WCAG AA contracts
        run: pnpm test:web:built
      - name: Verify the publishable tarball from a clean build
        run: python3 scripts/package-artifacts.py smoke
