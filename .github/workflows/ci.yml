name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  RUSTUP_TOOLCHAIN: 1.98.0

jobs:
  rust:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Enforce workflow supply-chain policy
        run: |
          python3 scripts/check-workflow-supply-chain.py
          python3 scripts/check-foundation.py
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Prove the server target gate rejects non-canonical targets
        run: |
          rustup target add aarch64-unknown-linux-gnu x86_64-unknown-linux-musl
          for target in aarch64-unknown-linux-gnu x86_64-unknown-linux-musl; do
            log="$RUNNER_TEMP/sarmg-server-target-$target.log"
            if cargo check --locked -p sarmg-server-target --target "$target" 2>"$log"; then
              echo "::error::sarmg-server-target unexpectedly accepted $target"
              exit 1
            fi
            grep -F "Sarmg server binaries support only x86_64-unknown-linux-gnu" "$log"
          done
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify every Cargo package carries its audited license text
        run: python3 scripts/check-rust-package-licenses.py
      - name: Check all targets
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Lint all targets
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test all crates
        run: cargo test --locked --workspace --all-features
      - name: Reject Rust documentation warnings
        run: RUSTDOCFLAGS="-Dwarnings" cargo doc --locked --workspace --all-features --no-deps

  web:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Enforce workflow supply-chain policy
        run: python3 scripts/check-workflow-supply-chain.py
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          check-latest: false
      - name: Install pnpm
        run: npm install --global pnpm@10.12.1 --ignore-scripts
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck packages
        run: pnpm typecheck
      - name: Build packages
        run: pnpm build
      - name: Test packages
        run: pnpm test
      - name: Verify publishable tarballs from a clean build
        run: python3 scripts/package-artifacts.py smoke
