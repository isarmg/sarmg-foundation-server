[workspace]
resolver = "3"
members = [
  "rust/crates/isarmg-error",
  "rust/crates/isarmg-sqlite",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["sarmg <isarmg@163.com>"]
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "sqlite",
  "runtime-tokio",
] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
