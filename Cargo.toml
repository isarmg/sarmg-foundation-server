[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/events",
  "crates/sdk",
  "crates/axum",
  "crates/gateway",
  "crates/postgres",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["sarmg <isarmg@163.com>"]
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
thiserror = "2"
