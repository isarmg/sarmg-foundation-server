[workspace]
resolver = "3"
members = [
  "rust/crates/sarmg-admin-auth",
  "rust/crates/sarmg-admin-axum",
  "rust/crates/sarmg-admin-core",
  "rust/crates/sarmg-admin-hyper",
  "rust/crates/sarmg-admin-sqlite",
  "rust/crates/sarmg-admin-static",
  "rust/crates/sarmg-contracts",
  "rust/crates/sarmg-error",
  "rust/crates/sarmg-schema-identity",
  "rust/crates/sarmg-server-target",
  "rust/crates/sarmg-sqlite",
  "rust/crates/sarmg-state-file",
  "rust/crates/sarmg-platform-db",
  "rust/crates/sarmg-server-runtime",
  "rust/crates/sarmg-fs-safety",
  "rust/crates/sarmg-secret",
  "rust/crates/sarmg-secret-envelope",
  "rust/crates/sarmg-secure-http",
  "rust/crates/sarmg-secure-xml",
  "rust/crates/sarmg-operations",
  "rust/crates/sarmg-testkit",
]

[workspace.package]
version = "0.7.5"
edition = "2024"
rust-version = "1.98"
authors = ["sarmg <isarmg@163.com>"]
license = "Apache-2.0"
repository = "https://github.com/isarmg/sarmg-foundation-server"
homepage = "https://github.com/isarmg/sarmg-foundation-server"

[workspace.dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
aes-gcm = "0.10"
hkdf = "0.12"
getrandom = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body-util = "0.1"
mime = "0.3"
ipnet = "2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
roxmltree = "0.20"
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
sqlx = { version = "0.8", default-features = false, features = [
  "sqlite",
  "runtime-tokio",
] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
zeroize = "1.8"
http-body = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tokio-util = { version = "0.7", features = ["rt"] }
socket2 = "0.6"
log = "0.4"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
